# docker-compose.yml

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: quoll
      POSTGRES_PASSWORD: 1223334444
      POSTGRES_DB: quoll_db
    ports:
      - "5432:5432"
