# одиночный узел для локальной разработки. Раскладку, ключ и бакет
# garage заводит сам при старте - см. command в docker-compose.yml
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "5f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"

[s3_api]
# должен совпадать с S3_REGION_NAME, иначе presigned-ссылки получают 400
s3_region = "garage"
api_bind_addr = "[::]:3900"
